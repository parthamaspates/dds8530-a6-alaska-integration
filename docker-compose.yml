# Local integration stack: PostgreSQL (relational source), MongoDB (document source), Kafka (KRaft, single broker),
# the listing feed API, and the app container that runs the notebook (Pandas, Dask, PySpark, Spark Streaming).
x-app: &app
  build: .
  image: dds8530-a6-app:latest
  volumes:
    - .:/work
  environment:
    PG_URL: postgresql+psycopg2://alaska:alaska@postgres:5432/alaska
    MONGO_URI: mongodb://mongo:27017
    KAFKA_BOOTSTRAP: kafka:9092
    FEED_API_URL: http://feed-api:8000
    FEED_RATE: "25"

services:
  postgres:
    image: postgres:16
    environment: {POSTGRES_USER: alaska, POSTGRES_PASSWORD: alaska, POSTGRES_DB: alaska}
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U alaska"], interval: 5s, retries: 20}

  mongo:
    image: mongo:7
    healthcheck: {test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"], interval: 5s, retries: 20}

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck: {test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"], interval: 10s, retries: 20}

  feed-api:
    <<: *app
    command: uvicorn alaska_int.feed_api:app --host 0.0.0.0 --port 8000

  app:
    <<: *app
    command: bash scripts/run_all.sh
    depends_on:
      postgres: {condition: service_healthy}
      mongo: {condition: service_healthy}
      kafka: {condition: service_healthy}
      feed-api: {condition: service_started}
